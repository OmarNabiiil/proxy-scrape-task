# Local MySQL 8 + Redis 7 only (PA19). Not for Kubernetes.
#
# Start from this folder:
#   docker compose up -d
# Stop:
#   docker compose down
#
# Ports:
#   MySQL  3306  (database laravel, user root, empty password — matches .env.example)
#   Redis  6379  (no password — matches REDIS_HOST / REDIS_PORT)
#
services:
  mysql:
    image: mysql:8
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: laravel
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  mysql_data:
